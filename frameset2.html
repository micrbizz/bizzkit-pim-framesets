<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frameset Demo 2 - QR & Barcodes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.9.2/semantic.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.9.2/semantic.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>

<body class="ui container">
    <h1 class="ui header">Demo 2 - QR Codes & Barcodes</h1>

    <p>
        This demo generates random QR codes and barcodes. In a real application, these could be generated from PIM data based on query string values.
    </p>

    <h2 class="ui dividing header">Generated QR Codes</h2>
    <div class="ui two column grid" id="qrCodesContainer"></div>

    <h2 class="ui dividing header">Generated Barcodes</h2>
    <div class="ui two column grid" id="barcodesContainer"></div>

    <h2 class="ui dividing header">Query String Parameters</h2>
    <table class="ui celled table">
        <thead>
            <tr>
                <th>Parameter</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody id="queryParamsTable"></tbody>
    </table>

    <script>
        // Function to get query string value or generate a random one
        function getValueOrRandom(paramName) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(paramName) || Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Function to generate QR Codes using QRCode.js
        function generateQRCodes() {
            const qrContainer = document.getElementById("qrCodesContainer");

            for (let i = 0; i < 2; i++) {
                let value = getValueOrRandom(`qr${i + 1}`);
                let column = document.createElement("div");
                column.className = "column";
                column.innerHTML = `
                    <div class="ui segment">
                        <h4 class="ui center aligned header">${value}</h4>
                        <div id="qrCode${i}" class="ui centered image"></div>
                    </div>`;
                qrContainer.appendChild(column);

                // Generate QR Code
                new QRCode(document.getElementById(`qrCode${i}`), {
                    text: value,
                    width: 150,
                    height: 150
                });
            }
        }

        // Function to generate Barcodes using JsBarcode
        function generateBarcodes() {
            const barcodeContainer = document.getElementById("barcodesContainer");

            for (let i = 0; i < 2; i++) {
                let value = getValueOrRandom(`barcode${i + 1}`);
                let column = document.createElement("div");
                column.className = "column";
                column.innerHTML = `
                    <div class="ui segment">
                        <h4 class="ui center aligned header">${value}</h4>
                        <svg id="barcode${i}"></svg>
                    </div>`;
                barcodeContainer.appendChild(column);

                // Generate Barcode
                JsBarcode(`#barcode${i}`, value, {
                    format: "CODE128",
                    displayValue: true,
                    lineColor: "#000",
                    width: 2,
                    height: 50
                });
            }
        }

        // Function to populate query string table
        function populateQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableBody = document.getElementById("queryParamsTable");

            if (!urlParams.entries().next().done) { // If query params exist
                urlParams.forEach((value, key) => {
                    let row = `<tr>
                        <td><strong>${key}</strong></td>
                        <td>${value}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="2" class="center aligned">No query parameters found</td></tr>`;
            }
        }

        // Run functions on page load
        document.addEventListener("DOMContentLoaded", () => {
            generateQRCodes();
            generateBarcodes();
            populateQueryParams();
        });
    </script>

</body>

</html>
